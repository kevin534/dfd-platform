# ============================================================
#  Déploiement Render.com — https://render.com
#  Connectez ce dépôt sur Render, il détecte ce fichier.
# ============================================================
services:
  - type: web
    name: dfd-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true          # Render génère un secret aléatoire
      - key: ADMIN_EMAIL
        value: admin@dfd.org
      - key: ADMIN_PASSWORD
        sync: false                   # à saisir dans le dashboard Render
      - key: PAYMENTS_MODE
        sync: false                   # laissez vide : chaque moyen de paiement passe en live dès que SES clés sont renseignées ci-dessous. Mettez "demo" pour tout forcer en simulation, quelles que soient les clés.
      # Clés de paiement (à renseigner dans le dashboard, jamais dans le code) :
      - key: ORANGE_CLIENT_ID
        sync: false
      - key: ORANGE_CLIENT_SECRET
        sync: false
      - key: ORANGE_MERCHANT_KEY
        sync: false
      - key: MTN_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_API_USER
        sync: false
      - key: MTN_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: live
      - key: PUBLIC_API_URL
        value: https://dfd-platform.onrender.com
      # Anti-spam (facultatif, mode démo sans clé) :
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      # E-mail de notification du formulaire de contact (facultatif, mode démo sans SMTP_HOST) :
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        value: kevinxavier.toukam@gmail.com
    disk:
      name: dfd-data
      mountPath: /app/server/data     # persiste la base SQLite
      sizeGB: 1
