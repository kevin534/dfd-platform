# ============================================================
#  Déploiement Render.com — https://render.com
#  Connectez ce dépôt sur Render, il détecte ce fichier.
# ============================================================
services:
  - type: web
    name: dfd-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true          # Render génère un secret aléatoire
      - key: ADMIN_EMAIL
        value: admin@dfd.org
      - key: ADMIN_PASSWORD
        sync: false                   # à saisir dans le dashboard Render
      - key: PAYMENTS_MODE
        value: demo                   # passez à "live" après avoir ajouté les clés
      # Clés de paiement (à renseigner dans le dashboard, jamais dans le code) :
      - key: ORANGE_CLIENT_ID
        sync: false
      - key: ORANGE_CLIENT_SECRET
        sync: false
      - key: ORANGE_MERCHANT_KEY
        sync: false
      - key: MTN_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_API_USER
        sync: false
      - key: MTN_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
    disk:
      name: dfd-data
      mountPath: /app/server/data     # persiste la base SQLite
      sizeGB: 1
